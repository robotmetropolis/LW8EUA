<QRZCOM_QSO_DOWNLOAD_STATUS:1>Y <BAND:3>40m <STATION_CALLSIGN:8>LW8EUA/A <DXCC:3>144 <QSO_DATE:8>20260531 <ITUZ:2>14 <CONT:2>SA <GRIDSQUARE:6>GF26rn <TX_PWR:1>5 <COMMENT:23>ACTIVACION POTA AR-0175 <SIG_INFO:4>POTA <MY_SIG_INFO:7>AR-0175 <FREQ_RX:5>7.065 <TIME_ON:4>1751 <QTH:14>José p Varela <MY_COUNTRY:9>Argentina <CALL:5>CX1SI <MODE:3>SSB <FREQ:5>7.065 <LAT:11>S033 27.486 <COUNTRY:7>Uruguay <LON:11>W054 31.525 <DISTANCE:3>382 <EOR>

        const ORIGIN_LAT = -34.53; // CABA
        const ORIGIN_LON = -58.46; // CABA

        // ==========================================
        // PARSER ADIF
        // ==========================================
        function parseAdifCoord(adifCoord) {
            if (!adifCoord) return null;
            try {
                const dir = adifCoord.charAt(0).toUpperCase();
                const degStr = adifCoord.substring(1, 4);
                const minStr = adifCoord.substring(5);
                const deg = parseFloat(degStr);
                const min = parseFloat(minStr);
                if (isNaN(deg) || isNaN(min)) return null;

                let dec = deg + (min / 60);
                if (dir === 'S' || dir === 'W') dec = -dec;
                return dec;
            } catch (e) { return null; }
        }

        function parseAdif(rawText) {
            const qsos = [];
            const records = rawText.toLowerCase().split('<eor>');
            
            records.forEach(rec => {
                if (rec.trim() === '') return;
                const qso = {};
                const regex = /<([a-z_]+):(\d+)[^>]*>([\s\S]*?)(?=<[a-z_]+:|$)/g;
                let m;
                while ((m = regex.exec(rec)) !== null) {
                    const key = m[1].toUpperCase();
                    const len = parseInt(m[2], 10);
                    const val = m[3].substring(0, len).trim();
                    qso[key] = val;
                }
                
                if (qso.CALL) {
                    if (qso.LAT) qso.DEC_LAT = parseAdifCoord(qso.LAT);
                    if (qso.LON) qso.DEC_LON = parseAdifCoord(qso.LON);
                    if (qso.QSO_DATE) qso.F_DATE = `${qso.QSO_DATE.substring(0,4)}-${qso.QSO_DATE.substring(4,6)}-${qso.QSO_DATE.substring(6,8)}`;
                    if (qso.TIME_ON) qso.F_TIME = `${qso.TIME_ON.substring(0,2)}:${qso.TIME_ON.substring(2,4)}`;
                    qsos.push(qso);
                }
            });
            return qsos;
        }

        // ==========================================
        // COMPONENTE GLOBO 3D
        // ==========================================
        const GEO_LABELS = [
            { text: "ARGENTINA", lat: -34.0, lon: -64.0, type: "country" },
            { text: "URUGUAY", lat: -32.52, lon: -55.76, type: "country" },
            { text: "CHILE", lat: -35.67, lon: -71.54, type: "country" },
            { text: "BRASIL", lat: -14.23, lon: -51.92, type: "country" },
            { text: "PARAGUAY", lat: -23.44, lon: -58.44, type: "country" },
            { text: "Buenos Aires", lat: -36.5, lon: -60.0, type: "province" },
            { text: "Córdoba", lat: -31.5, lon: -64.5, type: "province" },
            { text: "Santa Fe", lat: -30.5, lon: -60.5, type: "province" },
            { text: "Mendoza", lat: -34.5, lon: -68.5, type: "province" },
            { text: "Entre Ríos", lat: -32.0, lon: -59.0, type: "province" }
        ];

        const AirlineGlobe = ({ logs, mapTheme, showGeoLabels }) => {
            const mountRef = useRef(null);
            const labelsContainerRef = useRef(null);
            const geoLabelsContainerRef = useRef(null);
            const [labelsData, setLabelsData] = useState([]);
            const earthMatRef = useRef(null);

            useEffect(() => {
                if (earthMatRef.current) {
                    new THREE.TextureLoader().load(mapTheme, (tex) => { 
                        earthMatRef.current.map = tex; 
                        earthMatRef.current.needsUpdate = true; 
                    });
                }
            }, [mapTheme]);

            useEffect(() => {
                if (!mountRef.current) return;

                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020617);
                
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.z = 300;

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                mountRef.current.appendChild(renderer.domElement);

                const globeGroup = new THREE.Group();
                scene.add(globeGroup);

                const RADIUS = 100;

                scene.add(new THREE.AmbientLight(0xffffff, 0.4));
                const dLight = new THREE.DirectionalLight(0xffffff, 1.2);
                dLight.position.set(-800, 2000, 400);
                camera.add(dLight);
                scene.add(camera);

                const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
                const earthMat = new THREE.MeshPhongMaterial({
                    color: 0xffffff, emissive: 0x000000, specular: 0x222222, shininess: 15,
                });
                earthMatRef.current = earthMat;
                new THREE.TextureLoader().load(mapTheme, (tex) => { 
                    earthMat.map = tex; earthMat.needsUpdate = true; 
                });
                globeGroup.add(new THREE.Mesh(earthGeo, earthMat));

                const haloGeo = new THREE.SphereGeometry(RADIUS * 1.05, 32, 32);
                const haloMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8, transparent: true, opacity: 0.1, side: THREE.BackSide, blending: THREE.AdditiveBlending
                });
                globeGroup.add(new THREE.Mesh(haloGeo, haloMat));

                const getCoordinates = (lat, lng, alt = 0) => {
                    const phi = (90 - lat) * (Math.PI / 180);
                    const theta = (lng + 180) * (Math.PI / 180);
                    const r = RADIUS * (1 + alt);
                    return new THREE.Vector3(-(r * Math.sin(phi) * Math.cos(theta)), (r * Math.cos(phi)), (r * Math.sin(phi) * Math.sin(theta)));
                };

                const originVec = getCoordinates(ORIGIN_LAT, ORIGIN_LON);
                const animatedPoints = [];
                const radioPulses = [];
                const labels = [];

                const createStation = (pos, colorHex, isOrigin) => {
                    const core = new THREE.Mesh(new THREE.SphereGeometry(isOrigin ? 0.7 : 0.4, 16, 16), new THREE.MeshBasicMaterial({ color: colorHex }));
                    core.position.copy(pos);
                    globeGroup.add(core);

                    const glow = new THREE.Mesh(new THREE.SphereGeometry(isOrigin ? 1.8 : 1.2, 16, 16), new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
                    glow.position.copy(pos);
                    globeGroup.add(glow);

                    const ring = new THREE.Mesh(new THREE.RingGeometry(isOrigin ? 0.8 : 0.4, isOrigin ? 1.0 : 0.6, 32), new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
                    ring.position.copy(pos);
                    ring.lookAt(new THREE.Vector3(0,0,0));
                    globeGroup.add(ring);
                    radioPulses.push({ mesh: ring, progress: Math.random(), speed: 0.015, isOrigin });
                };

                createStation(originVec, 0x06b6d4, true); 
                labels.push({ pos: originVec.clone(), text: "LW8EUA", type: "origin" });

                logs.forEach((log) => {
                    if(log.DEC_LAT === undefined || log.DEC_LON === undefined) return;
                    
                    const destVec = getCoordinates(log.DEC_LAT, log.DEC_LON);
                    const distance = originVec.distanceTo(destVec);
                    
                    createStation(destVec, 0xf59e0b, false);
                    labels.push({ pos: destVec.clone(), text: log.CALL, type: "dest" });

                    const maxHeight = distance * 0.25;
                    const midPoint = originVec.clone().lerp(destVec, 0.5).normalize().multiplyScalar(RADIUS + maxHeight);
                    const curve = new THREE.QuadraticBezierCurve3(originVec, midPoint, destVec);
                    const curvePoints = curve.getPoints(50);
                    
                    let arcColor = 0x38bdf8; 
                    if (log.MODE === 'CW') arcColor = 0xc084fc; 
                    if (log.MODE === 'FT8' || log.MODE === 'DIGI') arcColor = 0xf472b6; 

                    globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curvePoints), new THREE.LineBasicMaterial({ color: arcColor, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending })));

                    const dashGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
                    const dashLine = new THREE.Line(dashGeo, new THREE.LineBasicMaterial({ color: arcColor, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending }));
                    dashGeo.setDrawRange(0, 0);
                    globeGroup.add(dashLine);

                    animatedPoints.push({ geo: dashGeo, pointsCount: 50, progress: Math.random(), speed: 0.002 + (150 / Math.max(distance, 100)) * 0.003 });
                });

                setLabelsData(labels);

                globeGroup.rotation.y = -Math.PI / 4; 
                globeGroup.rotation.x = Math.PI / 8;

                let isDragging = false;
                let prevMouse = { x: 0, y: 0 };
                let lastInteractionTime = 0; 

                const onMouseDown = () => { isDragging = true; lastInteractionTime = Date.now(); };
                const onMouseUp = () => { isDragging = false; lastInteractionTime = Date.now(); };
                const onMouseMove = (e) => {
                    if(isDragging) {
                        globeGroup.rotation.y += (e.clientX - prevMouse.x) * 0.005;
                        globeGroup.rotation.x += (e.clientY - prevMouse.y) * 0.005;
                        lastInteractionTime = Date.now();
                    }
                    prevMouse = { x: e.clientX, y: e.clientY };
                };
                const onWheel = (e) => {
                    camera.position.z += e.deltaY * 0.5;
                    camera.position.z = Math.max(150, Math.min(camera.position.z, 600)); 
                    lastInteractionTime = Date.now();
                };

                const canvasDom = renderer.domElement;
                canvasDom.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('mousemove', onMouseMove);
                canvasDom.addEventListener('wheel', onWheel, { passive: true });

                const tempV = new THREE.Vector3();
                const animate = () => {
                    requestAnimationFrame(animate);

                    if (!isDragging && (Date.now() - lastInteractionTime > 3000)) globeGroup.rotation.y -= 0.0005;

                    radioPulses.forEach(p => {
                        p.progress += p.speed;
                        if (p.progress >= 1) p.progress = 0; 
                        const scale = p.isOrigin ? 1 + (p.progress * 3) : 1 + (p.progress * 2.5);
                        p.mesh.scale.set(scale, scale, scale);
                        p.mesh.material.opacity = 1 - p.progress; 
                    });

                    animatedPoints.forEach(p => {
                        p.progress += p.speed;
                        if (p.progress >= 1.2) p.progress = -0.2; 
                        p.geo.setDrawRange(Math.max(0, Math.floor(p.progress * p.pointsCount)), 12);
                    });

                    renderer.render(scene, camera);

                    const updateLabels = (nodes, dataList) => {
                        if (!nodes) return;
                        dataList.forEach((lbl, i) => {
                            const node = nodes[i];
                            if (!node) return;
                            // Corrección: Comprobar si existe 'pos', si no, calcular desde lat/lon
                            const vec = lbl.pos ? lbl.pos : getCoordinates(lbl.lat, lbl.lon);
                            tempV.copy(vec);
                            globeGroup.localToWorld(tempV);
                            if (tempV.clone().normalize().dot(camera.position.clone().normalize()) < 0.2) {
                                node.style.display = 'none'; 
                            } else {
                                tempV.project(camera);
                                node.style.display = 'block';
                                node.style.transform = `translate(-50%, -50%) translate(${(tempV.x * 0.5 + 0.5) * width}px, ${(-(tempV.y * 0.5) + 0.5) * height}px)`;
                            }
                        });
                    };

                    if (labelsContainerRef.current) updateLabels(labelsContainerRef.current.children, labels);
                    if (showGeoLabels && geoLabelsContainerRef.current) updateLabels(geoLabelsContainerRef.current.children, GEO_LABELS);
                };
                animate();

                const onResize = () => {
                    if(!mountRef.current) return;
                    renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                    camera.aspect = mountRef.current.clientWidth / mountRef.current.clientHeight;
                    camera.updateProjectionMatrix();
                };
                window.addEventListener('resize', onResize);

                return () => {
                    window.removeEventListener('resize', onResize);
                    canvasDom.removeEventListener('mousedown', onMouseDown);
                    window.removeEventListener('mouseup', onMouseUp);
                    window.removeEventListener('mousemove', onMouseMove);
                    canvasDom.removeEventListener('wheel', onWheel);
                    mountRef.current?.removeChild(renderer.domElement);
                };
            }, [logs]);

            return (
                <div className="w-full h-full relative overflow-hidden bg-slate-950 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.5)] border border-slate-800">
                    <div ref={mountRef} className="w-full h-full cursor-move" />
                    
                    <div ref={labelsContainerRef} className="absolute top-0 left-0 w-full h-full pointer-events-none">
                        {labelsData.map((lbl, idx) => (
                            <div key={idx} className="absolute top-0 left-0 transition-opacity duration-100 flex items-center gap-1.5" style={{ willChange: 'transform' }}>
                                <div className={`w-6 h-[1px] ${lbl.type === 'origin' ? 'bg-cyan-500/80 shadow-[0_0_5px_#06b6d4]' : 'bg-amber-500/80 shadow-[0_0_5px_#f59e0b]'}`}></div>
                                <div className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded backdrop-blur-md border uppercase tracking-widest ${lbl.type === 'origin' ? 'bg-cyan-950/70 text-cyan-300 border-cyan-500/50' : 'bg-amber-950/70 text-amber-400 border-amber-500/50'}`}>
                                    {lbl.text}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div ref={geoLabelsContainerRef} className={`absolute top-0 left-0 w-full h-full pointer-events-none transition-opacity duration-300 ${showGeoLabels ? 'opacity-100' : 'opacity-0'}`}>
                        {GEO_LABELS.map((lbl, idx) => (
                            <div key={idx} className="absolute top-0 left-0 transition-opacity duration-100 text-center pointer-events-none" style={{ willChange: 'transform' }}>
                                <div className={lbl.type === 'country' ? 'text-[11px] font-black uppercase tracking-[0.2em] text-slate-300/40' : 'text-[9px] font-semibold text-slate-400/50'}>
                                    {lbl.text}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md p-3 rounded-lg border border-slate-700 text-xs text-slate-300 shadow-xl pointer-events-none">
                        <div className="flex items-center gap-2 mb-1"><div className="w-2 h-2 rounded-full bg-cyan-500"></div> Origen (LW8EUA)</div>
                        <div className="flex items-center gap-2 mb-1"><div className="w-2 h-2 rounded-full bg-amber-500"></div> Corresponsales</div>
                        <div className="flex items-center gap-2 mt-2 pt-2 border-t border-slate-700">
                            <div className="w-3 h-0.5 bg-sky-500"></div> SSB
                            <div className="w-3 h-0.5 bg-pink-400 ml-2"></div> DIGI
                            <div className="w-3 h-0.5 bg-purple-400 ml-2"></div> CW
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // COMPONENTE PRINCIPAL
        // ==========================================
        function App() {
            const [adifInput, setAdifInput] = useState(DEFAULT_ADIF);
            const [logs, setLogs] = useState([]);
            const [searchTerm, setSearchTerm] = useState("");
            const [showGeoLabels, setShowGeoLabels] = useState(true);
            
            const MAP_THEMES = {
                dark: 'https://unpkg.com/three-globe/example/img/earth-dark.jpg',
                blueMarble: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
                day: 'https://unpkg.com/three-globe/example/img/earth-day.jpg',
                night: 'https://unpkg.com/three-globe/example/img/earth-night.jpg'
            };
            const [currentMapTheme, setCurrentMapTheme] = useState(MAP_THEMES.dark);

            useEffect(() => { setLogs(parseAdif(DEFAULT_ADIF)); }, []);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setAdifInput(evt.target.result);
                    setLogs(parseAdif(evt.target.result));
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const stats = useMemo(() => {
                const totalQSOs = logs.length;
                const countries = new Set(logs.map(l => l.COUNTRY).filter(Boolean));
                let maxDist = 0;
                logs.forEach(log => {
                    if (log.DISTANCE) {
                        const d = parseInt(log.DISTANCE, 10);
                        if (d > maxDist) maxDist = d;
                    }
                });
                return { totalQSOs, totalCountries: countries.size, maxDist };
            }, [logs]);

            const filteredLogs = logs.filter(log => {
                if (!searchTerm) return true;
                const term = searchTerm.toLowerCase();
                return (log.CALL?.toLowerCase().includes(term) || log.COUNTRY?.toLowerCase().includes(term) || log.GRIDSQUARE?.toLowerCase().includes(term));
            });

            return (
                <div className="h-screen w-full bg-slate-950 text-slate-100 flex p-4 font-sans gap-4 selection:bg-sky-500/30 overflow-hidden">
                    <div className="w-[45%] flex flex-col gap-4 h-full">
                        <div className="bg-slate-900/80 backdrop-blur-xl p-4 rounded-2xl border border-slate-800 flex-shrink-0 shadow-xl flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="bg-gradient-to-br from-sky-400 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-sky-500/20">
                                    <Radio className="w-6 h-6 text-white" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-black tracking-wide text-white drop-shadow-md">LW8EUA/A</h1>
                                    <p className="text-sky-400 font-medium flex items-center gap-1 text-xs">
                                        <MapPin className="w-3.5 h-3.5" /> GF05rj
                                    </p>
                                </div>
                            </div>
                            <label className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-bold px-3 py-2 rounded-lg cursor-pointer flex items-center gap-2">
                                <Upload className="w-3.5 h-3.5 text-sky-400" /> Archivo .ADI
                                <input type="file" accept=".adi,.adif,.txt" className="hidden" onChange={handleFileUpload} />
                            </label>
                        </div>

                        <div className="grid grid-cols-3 gap-3 flex-shrink-0">
                            <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800/80 shadow-md">
                                <div className="text-slate-400 text-[11px] mb-1 uppercase font-semibold">QSOs</div>
                                <div className="text-xl font-bold text-white">{stats.totalQSOs}</div>
                            </div>
                            <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800/80 shadow-md">
                                <div className="text-slate-400 text-[11px] mb-1 uppercase font-semibold">DXCC</div>
                                <div className="text-xl font-bold text-sky-400">{stats.totalCountries}</div>
                            </div>
                            <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800/80 shadow-md">
                                <div className="text-slate-400 text-[11px] mb-1 uppercase font-semibold">Dist. Max</div>
                                <div className="text-xl font-bold text-emerald-400">{stats.maxDist}<span className="text-[10px] ml-1">KM</span></div>
                            </div>
                        </div>

                        <div className="flex-1 bg-slate-900/80 border border-slate-800 rounded-xl flex flex-col overflow-hidden">
                            <div className="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-800/30">
                                <h2 className="text-xs font-bold text-slate-200 uppercase flex items-center gap-2"><List className="w-4 h-4 text-sky-400" /> Logbook</h2>
                                <input type="text" placeholder="Buscar señal o país..." className="bg-slate-950 border border-slate-700 text-xs px-3 py-1.5 rounded-md text-slate-300 outline-none w-48" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                <table className="w-full text-[11px] text-left">
                                    <thead className="text-slate-400 bg-slate-900/90 sticky top-0 z-10 backdrop-blur-md">
                                        <tr><th className="px-4 py-2">Fecha/Hora</th><th className="px-4 py-2">Callsign</th><th className="px-4 py-2">Modo</th><th className="px-4 py-2 text-right">País</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/50">
                                        {filteredLogs.map((log, i) => (
                                            <tr key={i} className="hover:bg-slate-800/60 transition-colors group">
                                                <td className="px-4 py-2 text-slate-400">{log.F_DATE} {log.F_TIME}z</td>
                                                <td className="px-4 py-2 font-bold text-sky-100">{log.CALL}</td>
                                                <td className="px-4 py-2">{log.MODE} {log.BAND}</td>
                                                <td className="px-4 py-2 text-right text-slate-300">{log.COUNTRY}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 h-full relative">
                        <div className="absolute top-4 right-4 z-20 flex items-center gap-2 bg-slate-900/80 backdrop-blur-md p-1.5 rounded-lg border border-slate-700 shadow-xl">
                            <button onClick={() => setShowGeoLabels(!showGeoLabels)} className={`p-1.5 rounded-md ${showGeoLabels ? 'bg-sky-500/20 text-sky-400' : 'text-slate-400'}`}><MapIcon className="w-4 h-4" /></button>
                            <div className="w-px h-4 bg-slate-700 mx-1"></div>
                            <select className="bg-transparent text-xs text-slate-200 outline-none cursor-pointer" value={currentMapTheme} onChange={(e) => setCurrentMapTheme(e.target.value)}>
                                <option value={MAP_THEMES.dark} className="bg-slate-900">Oscuro</option>
                                <option value={MAP_THEMES.blueMarble} className="bg-slate-900">Satélite</option>
                                <option value={MAP_THEMES.day} className="bg-slate-900">Día</option>
                                <option value={MAP_THEMES.night} className="bg-slate-900">Luces</option>
                            </select>
                        </div>
                        <AirlineGlobe logs={logs} mapTheme={currentMapTheme} showGeoLabels={showGeoLabels} />
                    </div>
                </div>
            );
        }

        // Renderizar la app en el div#root
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
